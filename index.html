<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f3d5e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radiology Reports">
<meta name="description" content="Write radiology reports fast from ready templates and phrase banks – works offline">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Radiology Reports</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body spellcheck="false">

<!-- Home -->
<main id="home" class="view"></main>

<!-- Editor -->
<main id="editor" class="view" hidden>
  <header id="appbar">
    <button class="ab" type="button" id="abBack" aria-label="Back">‹</button>
    <div class="ab-title"><b id="abTitle"></b><small id="abSub"></small></div>
    <button class="ab txt" type="button" id="abVar">Version ▾</button>
    <button class="ab" type="button" id="abMore" aria-label="More">⋯</button>
  </header>

  <div id="viewport"><div id="scaler"><div id="stage"><div class="pages" id="pages"></div></div></div></div>

  <div id="ctxbar" hidden>
    <button class="cb g" type="button" data-do="addli">＋ Item</button>
    <button class="cb" type="button" data-do="up">↑</button>
    <button class="cb" type="button" data-do="down">↓</button>
    <button class="cb r" type="button" data-do="del">Delete</button>
    <button class="cb p" type="button" data-do="next">[ ] Next</button>
  </div>

  <nav id="dock" aria-label="Tools">
    <button class="dk" type="button" data-open="bank"><b>📖</b><span>Phrases</span></button>
    <button class="dk" type="button" data-open="add"><b>＋</b><span>Add</span></button>
    <button class="dk" type="button" data-open="fmt"><b>Aa</b><span>Format</span></button>
    <button class="dk" type="button" data-open="page"><b>☰</b><span>Page</span></button>
    <button class="dk" type="button" data-open="xp"><b>⎙</b><span>Export</span></button>
  </nav>

  <aside id="panel" aria-label="Control panel" data-tab="xp"></aside>
  <aside id="bank" aria-label="Phrase bank" hidden></aside>
</main>

<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
