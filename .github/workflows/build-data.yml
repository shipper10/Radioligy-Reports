name: Build report data
on:
  push:
    paths: ['* REPORTS/**', 'data/catalog-meta.json', 'data/modalities.json', 'tools/build_data.py']
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install python-docx && python tools/build_data.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data && (git diff --cached --quiet || git commit -m "chore: rebuild data" && git push)
